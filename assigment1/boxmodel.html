<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
       body{
        margin:0;
       }
        .box {
            width: 300px;
            height: 300px;
            background-color: rgb(20, 147, 56);
            border: 2px solid black;
            padding: 40px;
            margin: 30px;
        }
        .innerbox {
            width: 250px;
            height: 250px;
            background-color: lightcoral;
            border: 5px 20px 10px 15px;
            border-color: red green blue yellow;
            border-style:solid;
            margin: 20px 10px 50px 65px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="innerbox">
                <p>This is the content area of the box. It has a width of 100px and a height of 200px.</p>

            </div>
        </div>
    </div>

</body>
